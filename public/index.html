<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍄 Plumber Quest Online</title>
<meta name="description" content="Game platform online nhiều người chơi">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">🍄 Plumber Quest Online</div>
  <div class="online" id="online">Online: 0</div>
</header>

<div class="layout">

  <aside class="sidebar">

    <h2>Vào Game</h2>

    <input id="name" placeholder="Nhập tên">

    <select id="skin">
      <option value="classic">Classic Mario</option>
      <option value="gold">Gold Plumber</option>
      <option value="ninja">Night Ninja</option>
      <option value="frog">Frog Suit</option>
    </select>

    <button id="joinBtn">Tham Gia</button>

    <hr>

    <div class="stat">Xu: <b id="coin">0</b></div>
    <div class="stat">Điểm: <b id="score">0</b></div>

    <hr>

    <h3>Bảng Xếp Hạng</h3>
    <div id="board" class="board"></div>

    <hr>

    <h3>Điều Khiển</h3>
    <p>A / D hoặc ← → để đi</p>
    <p>W / Space / ↑ để nhảy</p>

    <div class="mobile">
      <button id="left">⬅</button>
      <button id="jump">⬆</button>
      <button id="right">➡</button>
    </div>

  </aside>

  <main class="gamepanel">
    <canvas id="game" width="1400" height="720"></canvas>
  </main>

</div>

<footer>
© Yah Games
</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js?v=2"></script>
</body>
</html>
