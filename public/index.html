<!-- FILE 3: public/index.html -->
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plumber Quest Online</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(180deg,#0ea5e9,#082f49);
color:#fff;
overflow-x:hidden;
}
header{
padding:14px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}
.logo{font-size:28px;font-weight:900}
.wrap{
max-width:1300px;
margin:auto;
padding:15px;
display:grid;
grid-template-columns:1fr 340px;
gap:16px;
}
.card{
background:#0f172aee;
border-radius:20px;
padding:16px;
box-shadow:0 12px 35px rgba(0,0,0,.35);
}
canvas{
width:100%;
max-width:100%;
background:#38bdf8;
border-radius:18px;
display:block;
image-rendering:pixelated;
}
h2,h3{margin-top:0}
input,button,select{
width:100%;
padding:12px;
margin-top:8px;
border:0;
border-radius:12px;
font-size:15px;
}
button{
cursor:pointer;
font-weight:700;
}
.green{background:#22c55e}
.blue{background:#38bdf8}
.red{background:#ef4444;color:#fff}
.yellow{background:#facc15}
.purple{background:#a78bfa}
.gray{background:#334155;color:#fff}
.stat{
background:#1e293b;
padding:12px;
border-radius:14px;
margin-top:10px;
}
.small{font-size:13px;color:#cbd5e1}
.skin{
padding:10px;
border-radius:14px;
background:#1e293b;
margin-top:8px;
}
footer{
text-align:center;
padding:30px;
color:#cbd5e1;
}
a{color:#7dd3fc;text-decoration:none}
.mobile{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:10px;
}
@media(max-width:900px){
.wrap{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
<div class="logo">🍄 Plumber Quest Online</div>
<div>
<a href="about.html">About</a> |
<a href="privacy.html">Privacy</a>
</div>
</header>

<div class="wrap">

<!-- LEFT -->
<div class="card">
<canvas id="game" width="960" height="540"></canvas>

<div class="mobile">
<button id="leftBtn" class="gray">⬅</button>
<button id="jumpBtn" class="blue">⬆</button>
<button id="rightBtn" class="gray">➡</button>
</div>
</div>

<!-- RIGHT -->
<div class="card">

<h2>👤 Tài khoản</h2>

<input id="nameInput" placeholder="Tên người chơi">
<button class="green" id="saveName">Lưu tên</button>

<div class="stat">
<div>🎯 Điểm: <b id="score">0</b></div>
<div>🪙 Coin: <b id="coins">0</b></div>
<div>👥 Online: <b id="online">1</b></div>
</div>

<h3>🎨 Skin nhân vật</h3>

<div class="skin">🔴 Classic Mario <button class="red skinBtn" data-skin="classic">Dùng</button></div>
<div class="skin">🟡 Gold Mario <button class="yellow skinBtn" data-skin="gold">Dùng</button></div>
<div class="skin">⚫ Shadow Mario <button class="gray skinBtn" data-skin="shadow">Dùng</button></div>
<div class="skin">🟢 Frog Suit <button class="green skinBtn" data-skin="frog">Dùng</button></div>
<div class="skin">🔵 Ice Mario <button class="blue skinBtn" data-skin="ice">Dùng</button></div>
<div class="skin">🟣 Galaxy Mario <button class="purple skinBtn" data-skin="galaxy">Dùng</button></div>

<button class="green" id="submitScore">📈 Gửi điểm</button>

<h3>🏆 Leaderboard</h3>
<div id="leaderboard" class="small">Chưa có dữ liệu</div>

<h3>💖 Ủng hộ</h3>
<a href="https://paypal.me/HAThi247/1" target="_blank">
<button class="yellow">Donate PayPal</button>
</a>

</div>
</div>

<footer>
© 2026 Yah Games
</footer>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

</body>
</html>
