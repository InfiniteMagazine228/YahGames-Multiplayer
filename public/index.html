<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plumber Quest Online V2</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:#fff;
overflow:hidden;
}
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 16px;
background:#111827;
}
.topbar h1{
margin:0;
font-size:28px;
color:#38bdf8;
}
.wrap{
display:grid;
grid-template-columns:1fr 300px;
gap:12px;
padding:12px;
height:calc(100vh - 60px);
}
canvas{
width:100%;
height:100%;
background:linear-gradient(#38bdf8,#2563eb);
border-radius:20px;
display:block;
}
.side{
background:#1e293b;
border-radius:20px;
padding:15px;
overflow:auto;
}
.card{
background:#0f172a;
padding:12px;
border-radius:14px;
margin-bottom:10px;
}
input,select,button{
width:100%;
padding:10px;
margin-top:8px;
border:0;
border-radius:10px;
font-size:16px;
}
button{
background:#22c55e;
font-weight:700;
cursor:pointer;
}
.mobile{
position:fixed;
left:0;right:0;bottom:10px;
display:flex;
gap:8px;
padding:0 10px;
}
.mobile button{
height:56px;
font-size:24px;
background:#334155;
color:#fff;
}
.jump{background:#38bdf8!important}
@media(max-width:900px){
.wrap{grid-template-columns:1fr}
.side{display:none}
}
</style>
</head>

<body>

<div class="topbar">
<h1>🍄 Plumber Quest Online</h1>
<div id="online">Online: 0</div>
</div>

<div class="wrap">

<canvas id="game" width="1280" height="720"></canvas>

<div class="side">

<div class="card">
Tên:
<input id="name" value="Player">
Skin:
<select id="skin">
<option value="classic">Classic Mario</option>
<option value="gold">Gold Mario</option>
<option value="ninja">Ninja Mario</option>
<option value="frog">Frog Suit</option>
</select>
<button id="joinBtn">Vào Game</button>
</div>

<div class="card">
<div>Coin: <span id="coin">0</span></div>
<div>Điểm: <span id="score">0</span></div>
</div>

<div class="card">
<h3>🏆 Leaderboard</h3>
<div id="board"></div>
</div>

<div class="card">
<a href="/about.html" style="color:#38bdf8">About</a><br>
<a href="/privacy.html" style="color:#38bdf8">Privacy</a>
</div>

</div>
</div>

<div class="mobile">
<button id="left">⬅</button>
<button id="jump" class="jump">⬆</button>
<button id="right">➡</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
